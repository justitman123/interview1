<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SysGears — демо в браузері</title>
    <link rel="icon" href="data:," />

    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 820px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { font-size: 1.4rem; }
      .task {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
        margin: 1rem 0;
      }
      .task h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
      pre {
        background: #f5f5f5;
        padding: .75rem;
        border-radius: 6px;
        overflow-x: auto;
        margin: 0;
      }
      .err { color: #b00; }
      .hint { color: #666; font-size: .9rem; }
    </style>
  </head>
  <body>
    <h1>SysGears — запуск рішень у браузері</h1>
    <p class="hint">
      Сторінка підключає зібрані ESM-модулі з <code>dist/</code> (TypeScript-рішення).
      Перед відкриттям виконайте <code>npm run build</code>.
    </p>

    <div class="task" id="task1">
      <h2>Задача 1 — конвертація одиниць</h2>
      <pre>—</pre>
    </div>
    <div class="task" id="task2">
      <h2>Задача 2 — фільтрація та сортування</h2>
      <pre>—</pre>
    </div>
    <div class="task" id="task3">
      <h2>Задача 3 — пошук астероїда</h2>
      <pre>—</pre>
    </div>
    <div class="task" id="task4">
      <h2>Задача 4 — динамічне опитування</h2>
      <pre>—</pre>
    </div>

    <script type="module">
      // Кожна задача: динамічний import скомпільованого рішення + виклик.
      // try/catch, щоб сторінка не падала, поки рішення ще не написані.
      const show = (id, value) => {
        document.querySelector(`#${id} pre`).textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
      };
      const run = async (id, path, call) => {
        try {
          const mod = await import(path);
          show(id, await call(mod));
        } catch (e) {
          document.querySelector(`#${id} pre`).classList.add("err");
          show(id, "Не вдалося запустити: " + e.message);
        }
      };

      run("task1", "./dist/task_1/index.js", async (m) => {
        // units.json грузим через fetch и передаём в функцию —
        // работает в любом браузере, без импорта JSON-модуля.
        const units = await fetch("./task_1/units.json").then((r) => r.json());
        return m.convertDistanceUnits(
          { distance: { unit: "m", value: 0.5 }, convertTo: "ft" },
          units
        );
      });
      run("task2", "./dist/task_2/index.js", (m) =>
        m.filterData(
          [
            { name: "John", email: "john2@mail.com" },
            { name: "John", email: "john1@mail.com" },
            { name: "Jane", email: "jane@mail.com" },
          ],
          { include: [{ name: "John" }], sortBy: ["email"] }
        )
      );
      run("task3", "./dist/task_3/index.js", (m) => m.findAsteroidLocation());
      run("task4", "./dist/task_4/index.js", (m) => m.testQuestioner());
    </script>
  </body>
</html>
